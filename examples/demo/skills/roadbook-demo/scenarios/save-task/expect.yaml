# go 定义取证入口。先重新加载页面，等待计数出现，然后核对下列事实。
# context.task_title 取自本次执行交接。计数 1 是本场景固定的业务预期。
# 重新打开后能读到空列表或计数 0 时，引用原文判 fail。页面未加载、无法核对时判 blocked。
goal: 确认任务保存后，重新打开列表仍能读到同一条任务
steps:
  - go: 重新打开 http://127.0.0.1:4173/tasks，等待「已保存任务」计数出现，再读列表
    check:
      - 任务列表中存在标题为 context.task_title 的任务
      - 计数显示「已保存任务：1」
